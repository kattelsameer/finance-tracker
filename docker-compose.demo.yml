services:
  mysql:
    image: mysql:8.0
    container_name: finance-tracker-mysql-demo
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: finance_tracker_demo
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_USER: ${MYSQL_USER:-financeuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-financepass}
    ports:
      - "3307:3306"  # Different port to avoid conflict with dev/prod
    volumes:
      - mysql_data_demo:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - finance-tracker-demo
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance-tracker-backend-demo
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: finance_tracker_demo
      DB_USER: ${MYSQL_USER:-financeuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-financepass}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env file}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:81,http://localhost:5173}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8080"  # Different port to avoid conflict
    networks:
      - finance-tracker-demo
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""  # Uses nginx proxy
        VITE_DEMO_MODE: "true"  # Enable demo banner
    container_name: finance-tracker-frontend-demo
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "81:8080"  # Different port to avoid conflict
    networks:
      - finance-tracker-demo

networks:
  finance-tracker-demo:
    driver: bridge
    name: finance-tracker-demo

volumes:
  mysql_data_demo:
    driver: local
    name: finance-tracker-mysql-demo
