spring:
  application:
    name: finance-tracker

  profiles:
    active: dev

  # HikariCP connection pool defaults
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: FinanceTrackerPool

  # JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null
    time-zone: UTC

# Server
server:
  port: 8080
  servlet:
    context-path: /
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB
  tomcat:
    max-http-post-size: 5242880
    max-http-request-header-size: 8192
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-that-should-be-changed-in-production-at-least-256-bits}
    expiration-ms: ${JWT_EXPIRATION:3600000}  # 1 hour in milliseconds
    cookie-name: auth_token
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  security:
    max-failed-attempts: 5
    lockout-duration-minutes: 15
    password-min-length: 12

# Logging
logging:
  level:
    root: INFO
    com.financetracker: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# OpenAPI
springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html
    operationsSorter: method
