spring:
  datasource:
    url: jdbc:mysql://mysql:3306/finance_tracker_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:financeuser}
    password: ${DB_PASSWORD:financepass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    show-sql: false
    hibernate:
      # Use none since Flyway manages schema
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    # Include both standard migrations and demo data
    locations: classpath:db/migration,classpath:db/demo
    out-of-order: true  # Allow demo migrations to run out of order

logging:
  level:
    root: INFO
    com.financetracker: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/finance-tracker-demo.log
    max-size: 10MB
    max-history: 30

# Demo-specific configuration
app:
  demo:
    enabled: true
    # Demo user credentials (displayed on login page)
    username: demo@example.com
    password: Demo123!
    # Auto-refresh demo data daily at 2 AM UTC
    reset-schedule: "0 0 2 * * *"
    # Display demo banner in UI
    show-banner: true

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 hours
    cookie-name: auth_token
    # Demo runs on http://localhost, so Secure cookies would be dropped by browsers
    cookie-secure: false
    cookie-same-site: Lax

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:81}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600
